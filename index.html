<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股投資儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── 深色主題（預設）──────────────────────────── */
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263348;
    --border: #334155;
    --accent: #00d4aa;
    --accent2: #3b82f6;
    --up: #ef4444;
    --down: #22c55e;
    --warn: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #475569;
    --shadow: rgba(0,0,0,0.3);
    --fs-xs: 13px;
    --fs-sm: 15px;
    --fs-md: 17px;
    --fs-lg: 20px;
    --fs-xl: 24px;
    --fs-2xl: 28px;
  }

  /* ── 淺色主題 ──────────────────────────────────── */
  html.light {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #e8eef5;
    --border: #cbd5e1;
    --accent: #0891b2;
    --accent2: #2563eb;
    --up: #dc2626;
    --down: #16a34a;
    --warn: #d97706;
    --text: #0f172a;
    --muted: #475569;
    --dim: #64748b;
    --shadow: rgba(0,0,0,0.08);
  }

  /* ── 字體大小 scale ────────────────────────────── */
  html.font-sm {
    --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px;
    --fs-lg: 18px; --fs-xl: 21px; --fs-2xl: 25px;
  }
  html.font-md {
    --fs-xs: 14px; --fs-sm: 16px; --fs-md: 18px;
    --fs-lg: 22px; --fs-xl: 26px; --fs-2xl: 30px;
  }
  html.font-lg {
    --fs-xs: 16px; --fs-sm: 18px; --fs-md: 21px;
    --fs-lg: 25px; --fs-xl: 29px; --fs-2xl: 34px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    font-size: var(--fs-sm);
    transition: background 0.25s, color 0.25s;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ── 主題切換列 ────────────────────────────────── */
  .theme-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 12px;
  }
  .theme-btn {
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: var(--fs-xs);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .theme-btn:hover, .theme-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: var(--surface2);
  }
  .font-size-ctrl {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .font-size-ctrl span {
    font-size: var(--fs-xs);
    color: var(--muted);
    padding: 0 4px;
  }
  .fsbtn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: var(--fs-md);
    line-height: 1;
    padding: 2px 5px;
    border-radius: 5px;
    transition: background 0.15s;
  }
  .fsbtn:hover { background: var(--surface2); }
  .fsbtn.active { color: var(--accent2); font-weight: 700; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .header-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  .header-date {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-xs);
    color: var(--muted);
    margin-top: 3px;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* Summary bar */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .summary-label {
    font-size: var(--fs-xs);
    color: var(--muted);
    margin-bottom: 6px;
  }
  .summary-value {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-xl);
    font-weight: 700;
  }
  .summary-sub {
    font-size: var(--fs-xs);
    margin-top: 3px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .accent { color: var(--accent); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--surface);
    border-radius: 12px;
    padding: 5px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    font-size: var(--fs-xs);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--muted);
    border: none;
    background: transparent;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
  }
  .tab.active {
    background: var(--accent2);
    color: white;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(59,130,246,0.35);
  }

  /* Section */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: var(--fs-xs);
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .add-btn {
    font-size: var(--fs-xs);
    color: var(--accent);
    background: none;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    font-weight: 600;
  }
  .add-btn:hover { background: var(--accent); color: #000; }

  /* Stock card */
  .stock-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .stock-card:hover { border-color: var(--accent2); box-shadow: 0 4px 16px var(--shadow); }
  .stock-card.expanded { border-color: var(--accent2); }

  .stock-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
  }
  .stock-left { flex: 1; }
  .stock-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    flex-wrap: wrap;
  }
  .stock-name {
    font-size: var(--fs-md);
    font-weight: 700;
  }
  .stock-code {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-xs);
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 8px;
    border-radius: 5px;
  }
  .stock-tag {
    font-size: var(--fs-xs);
    padding: 3px 8px;
    border-radius: 5px;
    font-weight: 600;
  }
  .tag-hold { background: rgba(59,130,246,0.2); color: #93c5fd; }
  .tag-watch { background: rgba(245,158,11,0.2); color: #fcd34d; }
  html.light .tag-hold { background: rgba(37,99,235,0.12); color: #1d4ed8; }
  html.light .tag-watch { background: rgba(217,119,6,0.12); color: #b45309; }
  .stock-sector {
    font-size: var(--fs-xs);
    color: var(--muted);
  }
  .stock-right { text-align: right; }
  .stock-price {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-xl);
    font-weight: 700;
  }
  .stock-change {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-sm);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 3px;
  }
  .change-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .stock-metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 0 18px 12px;
    font-size: var(--fs-xs);
    color: var(--muted);
  }
  .metric span { color: var(--text); font-weight: 600; }

  .stock-alert {
    margin: 0 18px 12px;
    padding: 10px 12px;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 8px;
    font-size: var(--fs-xs);
    color: var(--warn);
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.5;
  }
  html.light .stock-alert { background: rgba(217,119,6,0.08); }

  /* Expanded detail */
  .stock-detail {
    display: none;
    padding: 0 18px 16px;
    border-top: 1px solid var(--border);
  }
  .stock-card.expanded .stock-detail { display: block; }

  .detail-news { margin-top: 14px; }
  .news-title {
    font-size: var(--fs-xs);
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .news-item {
    font-size: var(--fs-xs);
    color: var(--text);
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }
  .news-item:last-child { border-bottom: none; }
  .news-dot { color: var(--accent); flex-shrink: 0; margin-top: 2px; }

  .ai-btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, rgba(0,212,170,0.12), rgba(59,130,246,0.12));
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    font-size: var(--fs-sm);
    color: var(--accent);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 600;
  }
  .ai-btn:hover { background: linear-gradient(135deg, rgba(0,212,170,0.22), rgba(59,130,246,0.22)); }
  .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .ai-result {
    margin-top: 12px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: var(--fs-sm);
    line-height: 1.8;
    color: var(--text);
    border-left: 4px solid var(--accent);
    display: none;
    white-space: pre-wrap;
  }
  .ai-result.show { display: block; }

  /* Add modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .modal-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--accent);
  }
  .form-row {
    margin-bottom: 12px;
  }
  .form-label {
    font-size: var(--fs-sm);
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
    font-weight: 500;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: var(--fs-sm);
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent2); }
  select.form-input { cursor: pointer; }
  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-cancel {
    flex: 1;
    padding: 12px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: var(--fs-sm);
  }
  .btn-confirm {
    flex: 1;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000;
    cursor: pointer;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: var(--fs-sm);
  }

  /* Suggestions tab */
  .suggest-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .suggest-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .suggest-name {
    font-size: var(--fs-md);
    font-weight: 700;
  }
  .suggest-reason {
    font-size: var(--fs-sm);
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .suggest-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stag {
    font-size: var(--fs-xs);
    padding: 4px 10px;
    border-radius: 5px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .stag.hot { background: rgba(239,68,68,0.12); color: var(--up); border-color: rgba(239,68,68,0.3); }
  .stag.new { background: rgba(0,212,170,0.12); color: var(--accent); border-color: rgba(0,212,170,0.3); }

  .loading-spinner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    color: var(--muted);
    font-size: var(--fs-sm);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .refresh-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  .market-overview {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .market-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: var(--fs-sm);
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .market-row:last-child { border-bottom: none; }
  .market-name { color: var(--text); font-weight: 600; }
  .market-val {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-sm);
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: var(--fs-xs);
    padding: 3px 7px;
    border-radius: 4px;
    font-weight: 700;
  }
  .badge-up { background: rgba(239,68,68,0.15); color: var(--up); }
  .badge-down { background: rgba(34,197,94,0.15); color: var(--down); }
  .badge-warn { background: rgba(245,158,11,0.15); color: var(--warn); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stock-card, .suggest-card { animation: fadeIn 0.3s ease both; }

  /* DCA styles */
  .dca-summary {
    background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(0,212,170,0.08));
    border: 1.5px solid rgba(59,130,246,0.35);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .dca-total-label { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 5px; }
  .dca-total-amount {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-2xl);
    font-weight: 700;
    color: var(--accent2);
  }
  .dca-total-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 3px; }
  .dca-batches { text-align: right; }
  .dca-batch-row {
    font-size: var(--fs-sm);
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
  }
  .dca-batch-day {
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-sm);
    font-weight: 700;
    color: var(--accent2);
    background: rgba(59,130,246,0.15);
    border-radius: 5px;
    padding: 2px 8px;
  }

  .countdown-banner {
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 14px;
    font-size: var(--fs-sm);
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.5;
  }
  .countdown-soon {
    background: rgba(239,68,68,0.10);
    border: 1.5px solid rgba(239,68,68,0.35);
    color: #fca5a5;
  }
  .countdown-ok {
    background: rgba(100,116,139,0.12);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .countdown-num {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14px;
  }

  .dca-group-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dca-day-badge {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    background: var(--accent2);
    color: white;
    border-radius: 5px;
    padding: 2px 8px;
  }

  .dca-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: fadeIn 0.3s ease both;
  }
  .dca-card-left { flex: 1; }
  .dca-card-name {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .dca-card-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .dca-card-right { text-align: right; }
  .dca-amount {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
  }
  .dca-amount-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .dca-edit-btn {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    margin-top: 5px;
    font-family: 'Noto Sans TC', sans-serif;
    display: block;
    margin-left: auto;
    transition: all 0.15s;
  }
  .dca-edit-btn:hover { color: var(--accent); border-color: var(--accent); }

  .dca-yearly {
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 14px;
    font-size: 12px;
  }
  .dca-yearly-title { color: var(--muted); margin-bottom: 8px; font-size: 11px; letter-spacing:.06em; }
  .dca-yearly-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .dca-yearly-row:last-child { border-bottom: none; }

  /* DCA add modal extras */
  .dca-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 101;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .dca-modal-overlay.show { display: flex; }

  /* Market enhancements */
  .market-section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .market-name-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .market-hint {
    font-size: 10px;
    color: var(--dim);
    line-height: 1.3;
  }
  .market-row { align-items: center; gap: 8px; }

  /* Glossary */
  .glossary-box {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .glossary-title {
    font-size: 11px;
    color: var(--muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.06em;
  }
  .glossary-item {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .glossary-item:last-child { border-bottom: none; }
  .glossary-q {
    font-size: var(--fs-sm);
    color: var(--text);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .glossary-arrow {
    color: var(--muted);
    font-size: var(--fs-lg);
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .glossary-item.open .glossary-arrow { transform: rotate(90deg); }
  .glossary-a {
    display: none;
    font-size: var(--fs-sm);
    color: var(--muted);
    line-height: 1.8;
    padding: 0 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .glossary-item.open .glossary-a { display: block; }
