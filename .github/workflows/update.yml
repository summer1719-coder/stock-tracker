# .github/workflows/update.yml
# 兩個時間點自動執行：
#   早上 8:45（台灣時間）→ 抓美股 + AI 開盤預測
#   下午 3:10（台灣時間）→ 抓台股收盤 + 新聞 + 損益

name: 台股追蹤板自動更新

on:
  schedule:
    - cron: '45 0 * * 1-5'   # UTC 00:45 = 台灣 08:45（週一到週五）
    - cron: '10 7 * * 1-5'   # UTC 07:10 = 台灣 15:10（週一到週五）
  workflow_dispatch:           # 允許手動觸發

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        run: python fetch_data.py

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "📊 自動更新 $(date +'%Y-%m-%d %H:%M' -d '+8 hours') 台灣時間"
          git push
